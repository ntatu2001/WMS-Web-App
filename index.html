<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="./src/assets/bk_logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Warehouse Management System</title>
        <script>
            // Anti-FOUC: resolve the theme before React mounts so the first paint is correct.
            try {
                var m = localStorage.getItem("themeMode") || "system";
                var dark =
                    m === "dark" ||
                    (m === "system" &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.dataset.theme = dark ? "dark" : "light";
                var lang = localStorage.getItem("lang");
                if (lang === "vi" || lang === "en") document.documentElement.lang = lang;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
